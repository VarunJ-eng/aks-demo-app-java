name: Spring Boot CI - SonarCloud - Trivy - AWS ECR - ArgoCD GitOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aks-demo-app-java
  GITOPS_REPOSITORY: VarunJ-eng/aks-demo-gitops-java

jobs:
  build-scan-push:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test application
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=varunj-eng \
            -Dsonar.projectKey=VarunJ-eng_aks-demo-app-java \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Build Docker image
        run: |
          docker build \
            -t aks-demo-app-java:${GITHUB_SHA} .

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aks-demo-app-java:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: 487043668737.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag aks-demo-app-java:${IMAGE_TAG} \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Update GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          ECR_REGISTRY: 487043668737.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPOSITORY}.git gitops-repo

          cd gitops-repo

          sed -i -E \
            "s|^[[:space:]]*image:.*|          image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}|" \
            dev/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dev/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
          else
            git commit -m "Deploy application image ${IMAGE_TAG}"
            git push origin main
          fi
